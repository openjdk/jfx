plugins {
    id("application")
}

def jarsPath = rootProject.layout.buildDirectory.dir("sdk/lib").get()

dependencies {
    implementation files(
            jarsPath.file("javafx.base.jar"),
            jarsPath.file("javafx.graphics.jar"),
            jarsPath.file("javafx.controls.jar"),
            jarsPath.file("javafx.swing.jar")
    ).builtBy(":sdk")
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(jfxBuildJdkVersion.substring(0, 2)))
}

application {
    mainClass = "com.oracle.test.manual.util.TestRunnerApp"
    applicationDefaultJvmArgs = [
        "--module-path", jarsPath.getAsFile().absolutePath,
        "--add-modules", "javafx.controls,javafx.swing"
    ]
}

jar {
    manifest.attributes("Main-Class": "com.oracle.test.manual.util.TestRunnerApp")
}
