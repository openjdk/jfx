#
# This GitHub actions YAML file runs a Maven build on each of the three primary
# platforms: Linux, macOS (both x64 and aarch64), Windows. The jobs are run
# using the default (latest) OS platform for each OS.
# We download a specific version of the boot JDK and use the Maven and native
# toolchains (MSVC, CMake, Xcode) that are preinstalled on each runner.
#
# The native javafx.graphics and javafx.media libraries are built by the Maven
# build on all three platforms (via CMake); the unit test suite therefore runs
# everywhere. Two media libraries exist on one platform only and are checked by
# a dedicated step after the build: avplugin on Linux (optional, needs the
# ffmpeg development packages) and jfxmedia_avf on macOS (the AVFoundation
# backend, which no development machine in this project can compile).
#
# NOTE: much of the build logic is duplicated for each platform. Keep this in
# mind when making changes.
#

name: JavaFX pre-submit tests

on:
  # Run GitHub actions on every push to all branches except the main production branches, also
  # exclude any branch starting with "WIP".
  push:
    branches-ignore:
      - master
      - main
      - 'jfx[0-9]+'
      - 'WIP*'
  # Enable triggering the workflow manually
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux_x64_build:
    name: Linux x64
    runs-on: "ubuntu-24.04"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_linux-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_linux-x64_bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Install build dependencies
        run: |
          set -x
          sudo apt-get update
          # The libav* packages are for the Linux-only avplugin, which
          # modules/javafx.media/native/linux.cmake builds only when pkg-config finds
          # them and otherwise skips with a STATUS message. libavcodec and libavformat
          # are compiled and linked against; libswscale supplies a header only - the
          # library itself is loaded with dlopen at runtime by plugins/av/videodecoder.c
          # and is deliberately never linked, so a system without it degrades instead
          # of failing to load.
          # libxtst6 is a run-time requirement, not a build one: no native library links
          # libXtst, but com.sun.glass.ui.gtk.GtkGlassNative opens libXtst.so.6, and
          # GtkGlassNativeHeadlessTest initializes that class without a display.
          sudo apt-get -y install libgl1-mesa-dev libx11-dev libxxf86vm-dev libxt-dev \
            pkg-config libgtk-3-dev libxtst6 libfreetype-dev libpango1.0-dev libasound2-dev \
            libavcodec-dev libavformat-dev libswscale-dev

      - name: Provide a null ALSA device
        run: |
          set -x
          # The javafx.media unit tests build a real GStreamer playback pipeline, whose Linux
          # audio sink is alsasink; it opens the default PCM as soon as the pipeline goes to
          # READY. A GitHub-hosted runner has no sound card, so that open fails, the pipeline
          # state change fails and GSTPlatform.createMediaPlayer hands back null. A null PCM
          # accepts the audio and discards it, which is all these tests need: nothing is played.
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "${HOME}/.asoundrc"

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          wget -O "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + gcc) and the
          # unit test suite. Web and system tests are skipped by default.
          # -fae (fail-at-end) approximates the "gradlew --continue" that the old CI
          # passed to its separate test run: after a failure Maven still builds and
          # tests every module that does not depend on the failed one.
          mvn -B -ntp -fae install "-Djfx.web.skipFfmTests=false"

      - name: Verify the optional avplugin was built
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # avplugin is the one media library whose CMake target is conditional, so a
          # dropped ffmpeg development package would remove ffmpeg-backed playback from
          # the build and from the artifacts with no other signal at all. Assert it.
          so=modules/javafx.media/target/native/bin/libavplugin.so
          if [ ! -f "${so}" ]; then
            echo "::error::${so} was not built - check libavcodec-dev/libavformat-dev/libswscale-dev"
            exit 1
          fi
          # The assignment doubles as an assertion: under bash -e a file with no
          # dynamic section leaves grep without a match, which fails the step here.
          needed=$(readelf -d "${so}" | grep NEEDED)
          echo "${needed}"
          # libswscale must not be among them. avplugin compiles against
          # <libswscale/swscale.h>, but every sws_* entry point is reached through
          # dlopen/dlsym in plugins/av/videodecoder.c, so a system without the library
          # loses only H.265/HEVC 10/12-bit decoding instead of failing to load the
          # plugin at all. A NEEDED entry would turn that recoverable capability check
          # into a hard load failure.
          if echo "${needed}" | grep -q libswscale; then
            echo "::error::${so} must dlopen libswscale at runtime, not link against it"
            exit 1
          fi
          nm -D --defined-only "${so}" | grep gst_plugin_desc

