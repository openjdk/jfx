  macos_x64_build:
    name: macOS x64
    runs-on: "macos-15-intel"

    env:
      BOOT_JDK_VERSION: "26.0.2"
      BOOT_JDK_FILENAME: "jdk-26.0.2_macos-x64_bin.tar.gz"
      BOOT_JDK_URL: "https://download.oracle.com/java/26/archive/jdk-26.0.2_macos-x64_bin.tar.gz"

    steps:
      - name: Checkout the source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: jfx

      - name: Download boot JDK
        run: |
          set -x
          mkdir -p "${HOME}/bootjdk"
          curl -L -o "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" "${BOOT_JDK_URL}"
          tar -xf "${HOME}/bootjdk/${BOOT_JDK_FILENAME}" -C "${HOME}/bootjdk"

      - name: Setup environment
        run: |
          set -x
          export JAVA_HOME="${HOME}/bootjdk/jdk-${BOOT_JDK_VERSION}.jdk/Contents/Home"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          export PATH="$JAVA_HOME/bin:$PATH"
          env | sort
          which java
          java -version
          mvn -version

      - name: Build JavaFX artifacts and run headless tests
        working-directory: jfx
        run: |
          set -x
          export PATH="$JAVA_HOME/bin:$PATH"
          # Full build: Java modules, native libraries (CMake + clang, Metal
          # shaders) and the unit test suite. Web and system tests are skipped
          # by default.
          # -fae (fail-at-end) approximates the "gradlew --continue" that the old CI
          # passed to its separate test run: after a failure Maven still builds and
          # tests every module that does not depend on the failed one.
          mvn -B -ntp -fae install "-Djfx.web.skipFfmTests=false"

      - name: Verify the AVFoundation backend compiled and linked
        if: ${{ !cancelled() }}
        working-directory: jfx
        run: |
          set -x
          # These two jobs are the only place jfxmedia/platform/osx/avf is ever
          # compiled: no machine this project is developed on has an Objective-C
          # toolchain. add_media_library uses SHARED with clang's default
          # -undefined error, so macOS is also the one platform where a dangling
          # symbol is fatal at link - which is what makes a clean link here real
          # evidence rather than a formality. This runs even when an earlier step
          # failed, so the AVF result is reported either way.
          dylib=modules/javafx.media/target/native/bin/libjfxmedia_avf.dylib
          if [ ! -f "${dylib}" ]; then
            echo "::error::${dylib} was not built - the AVFoundation backend did not compile or link"
            exit 1
          fi
          file "${dylib}"
          otool -L "${dylib}"
          nm -gU "${dylib}" | head -40

